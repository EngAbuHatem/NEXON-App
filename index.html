<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NEXON App</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F2F5FB;
            --card: #fff;
            --ink: #0B1530;
            --mut: #5A6585;
            --acc: #0A6CFF;
            --acc2: #00C2D1;
            --line: #DCE3F0;
            --ok: #16A34A;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #060B1C;
                --card: #0E1630;
                --ink: #EAF0FF;
                --mut: #9AA7CF;
                --acc: #4C94FF;
                --line: #1E2A52
            }
        }

        :root[data-theme="dark"] {
            --bg: #060B1C;
            --card: #0E1630;
            --ink: #EAF0FF;
            --mut: #9AA7CF;
            --acc: #4C94FF;
            --line: #1E2A52
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: Cairo, Tahoma, Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            justify-content: center
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        :focus-visible {
            outline: 3px solid var(--acc2);
            outline-offset: 2px
        }

        #app {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg)
        }

        .main {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px 24px
        }

        .tabs {
            display: flex;
            border-top: 1px solid var(--line);
            background: var(--card)
        }

        .tabs button {
            flex: 1;
            border: 0;
            background: none;
            padding: 8px 2px 6px;
            font-size: .72rem;
            color: var(--mut);
            font-weight: 600
        }

        .tabs button span {
            display: block;
            font-size: 1.3rem;
            line-height: 1.2
        }

        .tabs button.on {
            color: var(--acc)
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 4px;
            font-weight: 900
        }

        h2 {
            font-size: 1.1rem;
            margin: 22px 0 10px;
            font-weight: 800
        }

        .mut {
            color: var(--mut);
            font-size: .9rem
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 14px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, var(--acc), var(--acc2))
        }

        .btn.s {
            background: var(--card);
            color: var(--ink);
            border: 1px solid var(--line)
        }

        .hero {
            border-radius: 20px;
            padding: 22px;
            color: #fff;
            background: radial-gradient(circle at 80% 0, #00C2D1, transparent 55%), linear-gradient(135deg, #07122B, #0A3C9E)
        }

        .hero p {
            margin: 4px 0 14px;
            opacity: .9
        }

        .row {
            display: flex;
            gap: 10px
        }

        .row>* {
            flex: 1
        }

        .q {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            font-weight: 700;
            font-size: .9rem
        }

        .q span {
            display: block;
            font-size: 1.7rem
        }

        .hs {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px
        }

        .hs .sc {
            min-width: 150px
        }

        .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .sc {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: hidden;
            text-align: start;
            padding: 0;
            display: block;
            width: 100%
        }

        .art {
            height: 84px;
            display: grid;
            place-items: center;
            font-size: 2.2rem;
            background: radial-gradient(circle at 25% 15%, hsl(var(--h) 95% 62%), transparent 60%), linear-gradient(135deg, hsl(var(--h) 80% 20%), hsl(calc(var(--h) + 55) 85% 36%))
        }

        .sc b {
            display: block;
            padding: 8px 12px 0;
            font-size: .92rem
        }

        .sc small {
            display: block;
            padding: 0 12px 10px;
            color: var(--mut)
        }

        .od {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px
        }

        .od .t {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-weight: 700
        }

        .chip {
            font-size: .75rem;
            padding: 2px 10px;
            border-radius: 99px;
            background: var(--line);
            white-space: nowrap
        }

        .chip.p {
            background: #FEF3C7;
            color: #92400E
        }

        .chip.d {
            background: #DCFCE7;
            color: #166534
        }

        .bar {
            height: 6px;
            border-radius: 9px;
            background: var(--line);
            margin-top: 10px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--acc), var(--acc2));
            transition: width .6s
        }

        .chat {
            display: flex;
            flex-direction: column;
            height: 100%
        }

        .msgs {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 8px
        }

        .m {
            max-width: 80%;
            padding: 9px 14px;
            border-radius: 16px;
            background: var(--card);
            border: 1px solid var(--line)
        }

        .m.u {
            align-self: flex-end;
            background: var(--acc);
            color: #fff;
            border: 0
        }

        .in {
            display: flex;
            gap: 8px;
            padding-top: 8px
        }

        .in input {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--card)
        }

        .in button {
            width: auto;
            padding: 0 18px
        }

        .li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 13px 14px;
            margin-bottom: 10px
        }

        .lg button {
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 99px;
            padding: 3px 12px;
            margin-inline-start: 4px;
            font-weight: 700
        }

        .lg button.on {
            background: var(--acc);
            color: #fff;
            border-color: var(--acc)
        }

        .sheet {
            position: absolute;
            inset: 0;
            background: var(--bg);
            z-index: 5;
            display: flex;
            flex-direction: column;
            animation: up .3s
        }

        @keyframes up {
            from {
                transform: translateY(40px);
                opacity: 0
            }
        }

        .sh {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
            font-weight: 800
        }

        .sh button {
            border: 0;
            background: none;
            font-size: 1.4rem
        }

        .sb {
            flex: 1;
            overflow-y: auto;
            padding: 16px
        }

        label {
            display: block;
            font-weight: 700;
            margin: 12px 0 4px
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--card)
        }

        .toast {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            inset-inline: 16px;
            background: var(--ink);
            color: var(--bg);
            padding: 12px 16px;
            border-radius: 14px;
            z-index: 9;
            font-weight: 700;
            animation: up .3s
        }

        .ctr {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            gap: 12px
        }

        .logo {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: .05em;
            direction: ltr
        }

        .logo i {
            font-style: normal;
            color: var(--acc)
        }

        .pk {
            padding: 16px;
            text-align: center;
            font-weight: 800
        }

        #app {
            background: radial-gradient(60% 38% at 100% 0, rgba(0, 194, 209, .25), transparent 70%), radial-gradient(55% 40% at 0 35%, rgba(10, 108, 255, .25), transparent 70%), var(--bg)
        }

        .sc,
        .od,
        .li,
        .q,
        .m:not(.u) {
            background: color-mix(in srgb, var(--card) 78%, transparent);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(110, 150, 255, .25);
            box-shadow: 0 10px 28px rgba(10, 60, 170, .14)
        }

        .sc {
            transition: transform .2s, box-shadow .2s
        }

        .sc:active,
        .q:active {
            transform: scale(.96)
        }

        .sc:hover {
            box-shadow: 0 14px 34px rgba(10, 108, 255, .35);
            transform: translateY(-3px)
        }

        .art {
            height: 108px;
            position: relative;
            overflow: hidden;
            font-size: 2.7rem
        }

        .art::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .28) 50%, transparent 65%);
            transform: translateX(-100%)
        }

        .sheet .art {
            height: 180px;
            font-size: 4.5rem
        }

        .art.im {
            background-size: cover;
            background-position: center
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: 24px 20px;
            border: 1px solid rgba(255, 255, 255, .18);
            box-shadow: 0 18px 40px rgba(10, 60, 170, .4);
            background: radial-gradient(circle at 85% 0, rgba(0, 194, 209, .9), transparent 50%), radial-gradient(circle at 0 100%, rgba(120, 60, 255, .55), transparent 55%), linear-gradient(135deg, #050E26, #0A3C9E)
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            inset-inline-end: -40px;
            top: -50px;
            background: rgba(255, 255, 255, .12)
        }

        .hl {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: .14em;
            direction: ltr;
            background: linear-gradient(90deg, #fff, #7FE9FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative
        }

        .hst {
            display: flex;
            gap: 10px;
            margin: 0 0 14px;
            position: relative
        }

        .hst div {
            flex: 1;
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 14px;
            padding: 6px;
            text-align: center
        }

        .hst b {
            display: block;
            font-size: 1.1rem
        }

        .hero .btn {
            position: relative
        }

        .btn {
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 24px rgba(10, 108, 255, .38)
        }

        .btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .35) 50%, transparent 65%);
            transform: translateX(-120%)
        }

        .btn.s {
            box-shadow: none
        }

        .tabs {
            margin: 0 12px 2px;
            border: 1px solid rgba(110, 150, 255, .28);
            border-radius: 26px;
            padding: 4px;
            background: color-mix(in srgb, var(--card) 82%, transparent);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(10, 60, 170, .25)
        }

        .tabs button {
            border-radius: 20px;
            transition: background .25s, color .25s
        }

        .tabs button span {
            transition: transform .25s
        }

        .tabs button.on {
            background: linear-gradient(135deg, rgba(10, 108, 255, .22), rgba(0, 194, 209, .22));
            font-weight: 800
        }

        .tabs button.on span {
            transform: translateY(-2px) scale(1.15);
            filter: drop-shadow(0 4px 8px rgba(10, 108, 255, .6))
        }

        .bar i {
            background-image: linear-gradient(90deg, var(--acc), var(--acc2), var(--acc));
            background-size: 200% 100%
        }

        .chip {
            border: 1px solid rgba(110, 150, 255, .3)
        }

        h1 {
            background: linear-gradient(90deg, var(--ink), var(--acc));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .logo {
            font-size: 3.2rem;
            background: linear-gradient(90deg, var(--ink), var(--acc2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .logo i {
            -webkit-text-fill-color: var(--acc2)
        }

        .ld {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid var(--line);
            border-top-color: var(--acc2)
        }

        .dev {
            text-align: center;
            font-size: .74rem;
            letter-spacing: .14em;
            color: var(--mut);
            padding: 5px 0 8px;
            direction: ltr
        }

        .dev b {
            background: linear-gradient(90deg, var(--acc), var(--acc2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 900
        }

        .dev.abs {
            position: absolute;
            inset-inline: 0;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 6px)
        }

        .sheet .dev {
            border-top: 1px solid var(--line)
        }

        @media(prefers-reduced-motion:no-preference) {
            @keyframes shine {
                to {
                    transform: translateX(120%)
                }
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }

            @keyframes pop {
                from {
                    opacity: 0;
                    transform: translateY(16px) scale(.97)
                }
            }

            @keyframes glow {
                50% {
                    filter: drop-shadow(0 0 16px rgba(0, 194, 209, .85))
                }
            }

            @keyframes bs {
                to {
                    background-position: -200% 0
                }
            }

            .art::after {
                animation: shine 3.4s infinite
            }

            .btn::after {
                animation: shine 3.2s infinite
            }

            .ld {
                animation: spin 1s linear infinite
            }

            .logo {
                animation: glow 2.4s infinite
            }

            .bar i {
                animation: bs 2.4s linear infinite
            }

            #app.an .main>*,
            #app.an .g2>*,
            #app.an .hs>*,
            #app.an .od {
                animation: pop .5s both
            }

            #app.an .g2>*:nth-child(2),
            #app.an .hs>*:nth-child(2) {
                animation-delay: .07s
            }

            #app.an .g2>*:nth-child(3),
            #app.an .hs>*:nth-child(3) {
                animation-delay: .14s
            }

            #app.an .g2>*:nth-child(n+4),
            #app.an .hs>*:nth-child(n+4) {
                animation-delay: .21s
            }

            .sc:hover .art {
                font-size: 3.1rem
            }
        }

        @media(prefers-reduced-motion:reduce) {

            .sheet,
            .toast {
                animation: none
            }

            .bar i {
                transition: none
            }
        }
    </style>
</head>

        function view() {
            const x = t();
            if (splash) return `<div class="ctr"><div class="logo">NEX<i>ON</i></div><div class="mut">${x.tag}</div><div class="ld"></div></div><div class="dev abs">Dev: <b>Salem</b></div>`;
            if (!user) return `<div class="ctr" style="justify-content:flex-start;padding-top:56px;min-height:0;overflow-y:auto"><div class="logo" style="font-size:2.4rem">NEX<i>ON</i></div><div class="mut">${mode === "in" ? x.li2 : x.su}</div><div style="width:100%;max-width:320px;text-align:start">${mode === "up" ? `<label>${x.nm}</label><input id="un" autocomplete="name" value="${esc(f.n)}">` : ""}<label>${x.em}</label><input id="em" type="email" autocomplete="email" inputmode="email" value="${esc(f.e)}"><label>${x.pw}</label><input id="pw" type="password" autocomplete="${mode === "in" ? "current-password" : "new-password"}">${mode === "up" ? `<label>${x.pw2}</label><input id="p2" type="password" autocomplete="new-password">` : ""}<div style="color:#E11D48;min-height:26px;font-size:.88rem;margin:8px 0 4px">${err ? x[err] : ""}</div><button class="btn" data-a="auth">${mode === "in" ? x.li2 : x.su}</button><button class="btn s" style="margin-top:10px" data-a="mode">${mode === "in" ? x.no : x.have}</button><button class="btn s" style="margin-top:10px" data-a="guest">${x.guest}</button></div><div class="lg" style="margin:14px 0 40px">${lg()}</div></div><div class="dev abs">Dev: <b>Salem</b></div>`;
            let b = "";
            if (tab === "home") b = `<h1>${x.hi} ${user} 👋</h1><div class="mut">${x.tag}</div><div class="hero" style="margin-top:14px"><div class="hl">NEXON</div><p>${x.tag}</p><div class="hst"><div><b>10+</b>🧩</div><div><b>24/7</b>💬</div><div><b>3</b>🌍</div></div><button class="btn s" data-a="tab:svcs" style="width:auto;padding:9px 22px;color:#0B1530">${x.all}</button></div><div class="row" style="margin-top:12px"><button class="q" data-a="sh:games"><span>🎮</span>${x.gm}</button><button class="q" data-a="sh:crs"><span>🎓</span>${x.crs}</button></div><h2>${x.pop}</h2><div class="hs">${S.slice(0, 6).map(sc).join("")}</div>`;
            if (tab === "svcs") b = `<h1>${x.tabs[1]}</h1><div class="mut" style="margin-bottom:12px">${x.sam}</div><div class="g2">${S.map(sc).join("")}</div>`;
            if (tab === "ord") b = `<h1>${x.tabs[2]}</h1><div style="height:12px"></div>` + (orders.length ? orders.map(o => `<div class="od"><div class="t"><span>${o.n}</span><span class="chip ${["", "p", "d"][o.s]}">${x.st[o.s]}</span></div><div class="mut">#${o.id} · $${o.p}</div><div class="bar"><i style="width:${[15, 60, 100][o.s]}%"></i></div></div>`).join("") : `<div class="mut">${x.none}</div>`);

            const tabs = ["home", "svcs", "ord", "chat", "acc"], ic = ["🏠", "🧩", "📦", "💬", "👤"];

        function lg() {return ["ar", "en", "fr"].map(l => `<button data-a="lang:${l}" class="${l === L ? "on" : ""}">${l.toUpperCase()}</button>`).join("")}

            const x = t(), [k, id] = sheet;
            if (k === "svc") {const s = S.find(v => v[0] === id); return shell(s[4][li()], `<div class="sc" style="margin-bottom:14px">${art(s[1], s[2], s[0])}</div><div style="font-size:1.4rem;font-weight:900;color:var(--acc)">${x.from} $${s[3]}</div><p class="mut">${x.det}</p><button class="btn" data-a="form:${id}">${x.ord}</button>`)}
